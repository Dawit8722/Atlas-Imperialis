appId: com.realmsmith.studio
productName: RealmSmith
copyright: Copyright © 2026 RealmSmith Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RealmSmith
mac:
  icon: build/icon.png
  category: public.app-category.games
  target:
    - dmg
linux:
  icon: build/icon.png
  category: Game
  target:
    - AppImage
